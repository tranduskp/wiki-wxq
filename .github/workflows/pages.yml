name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only what the site loads: pages, assets, card data and translations, the light webp images.
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html ky-thu doi-hinh xep-doi-hinh cap-nhat assets _site/
          mkdir -p _site/data/anh
          cp data/nhom.json data/ky-thu.json _site/data/
          cp -r data/bai data/dich _site/data/
          cp -r data/anh/web data/anh/theo-url.json _site/data/anh/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
